name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for a Vercel token
        id: gate
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::notice::VERCEL_TOKEN is not set - skipping the deploy. Add the three Vercel secrets to enable it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        if: steps.gate.outputs.skip != 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.gate.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build project
        if: steps.gate.outputs.skip != 'true'
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Apply database migrations
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -a
          [ -f .vercel/.env.production.local ] && . ./.vercel/.env.production.local
          set +a
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is not set on the Vercel project — skipping migrations"
            exit 0
          fi
          npx prisma migrate deploy

      - name: Deploy to production
        if: steps.gate.outputs.skip != 'true'
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
