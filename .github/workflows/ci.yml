name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hawa
          POSTGRES_PASSWORD: hawa
          POSTGRES_DB: hawa_computer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hawa -d hawa_computer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://hawa:hawa@localhost:5432/hawa_computer?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  image:
    name: Build the production image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hawa-computer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name hawa-smoke -e DATABASE_URL="postgresql://x:x@127.0.0.1:5432/x" -p 3000:3000 hawa-computer:ci
          sleep 8
          docker logs hawa-smoke | tail -20
          docker rm -f hawa-smoke
