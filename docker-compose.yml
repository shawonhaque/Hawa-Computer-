services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hawa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hawa_dev_password}
      POSTGRES_DB: hawa_computer
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawa -d hawa_computer"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hawa:${POSTGRES_PASSWORD:-hawa_dev_password}@db:5432/hawa_computer?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      BUSINESS_PHONE: ${BUSINESS_PHONE:-+8801700000000}
      BUSINESS_WHATSAPP: ${BUSINESS_WHATSAPP:-+8801700000000}
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-hello@hawacomputer.com}
      UPLOAD_DIR: /app/storage/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  migrate:
    build: .
    profiles: ["setup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hawa:${POSTGRES_PASSWORD:-hawa_dev_password}@db:5432/hawa_computer?schema=public
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

  # Optional TLS terminator: `docker compose --profile proxy up -d` with a real SITE_DOMAIN.
  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
